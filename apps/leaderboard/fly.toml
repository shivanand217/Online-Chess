# Internal-only ELO apply + top-N reads. Fronted by the gateway proxy.
app = "chess-leaderboard"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  LEADERBOARD_PORT = "3004"
  LOG_LEVEL = "info"

[[services]]
  internal_port = 3004
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3004

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Public HTTP edge. Clients hit this; it fans out to the internal services via Fly's private network
# at <app>.flycast. Scale by number of machines, not CPU — the gateway's work is almost all IO.
#
# App name is a placeholder — pick one unique to your Fly account and `fly apps rename` or just
# edit here before the first `fly launch --no-deploy`.
app = "chess-gateway"
primary_region = "iad"

# No `[build].dockerfile` — the Dockerfile path is passed on the CLI
# (`fly deploy --dockerfile apps/gateway/Dockerfile …`) so the monorepo root stays the build context.

[env]
  NODE_ENV = "production"
  GATEWAY_PORT = "3000"
  LOG_LEVEL = "info"
  # Internal service hostnames — these resolve on Fly's private 6PN network.
  MATCHMAKER_URL = "http://chess-matchmaker.flycast:3001"
  SESSION_ROUTER_URL = "http://chess-session-router.flycast:3002"
  LEADERBOARD_URL = "http://chess-leaderboard.flycast:3004"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

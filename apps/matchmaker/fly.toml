# Internal-only pairing worker. No public endpoint — the gateway reaches it via
# chess-matchmaker.flycast:3001 on Fly's private network. Keep one machine running so the pairing
# sweep timer stays alive.
app = "chess-matchmaker"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  MATCHMAKER_PORT = "3001"
  LOG_LEVEL = "info"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    # Internal-only: TCP on 3001 inside the Fly 6PN network, no handlers → no public ingress.
    port = 3001

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

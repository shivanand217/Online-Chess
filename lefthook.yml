# Git hooks (lefthook): runs prettier + eslint on staged files before each commit. Hand-written.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,yaml,yml}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js}'
      run: pnpm eslint {staged_files}

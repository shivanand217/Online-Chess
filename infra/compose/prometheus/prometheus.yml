# Prometheus config for the local observability stack. Scrapes each service's /metrics via
# host.docker.internal, loads the recording + alerting rules, and pairs with Grafana for display.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: chess-services
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels: { service: gateway }
      - targets: ['host.docker.internal:3001']
        labels: { service: matchmaker }
      - targets: ['host.docker.internal:3002']
        labels: { service: session-router }
      - targets: ['host.docker.internal:3003']
        labels: { service: game-server }
      - targets: ['host.docker.internal:3004']
        labels: { service: leaderboard }
